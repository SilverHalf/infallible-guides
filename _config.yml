title: Infallible Guides
description: Advanced raid speedrunning and Infallible achievment guides. 
theme: just-the-docs

url: https://silverhalf.github.io/infallible-guides

favicon_ico: "/images/favicon.ico"

aux_links:
  "Source Code": 
    - "https://github.com/SilverHalf/infallible-guides"

aux_links_new_tab: true

color_scheme: default

callouts:
  note:
    title: Note
    color: notes

  warning:
    title: Warning
    color: warning

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  quiet_deps: true # https://github.com/just-the-docs/just-the-docs/issues/1541
  silence_deprecations: ['import'] # https://github.com/just-the-docs/just-the-docs/issues/1607
